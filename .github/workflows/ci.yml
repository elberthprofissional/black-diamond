name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main]

# ── Variáveis de ambiente do build (necessárias!) ──
# O Vite injeta essas chaves no bundle em tempo de build, e src/lib/supabase.ts
# LANÇA ERRO na importação se VITE_SUPABASE_URL/ANON_KEY estiverem vazias — ou
# seja, os jobs que servem o app (e2e, a11y, lighthouse) precisam de um dist
# BUILT COM essas envs. Configure no GitHub:
#   Settings > Secrets and variables > Actions
# (São as mesmas chaves do seu .env local.)
env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  # Credenciais admin usadas pelo auth.setup do Playwright. Necessárias apenas
  # quando BASE_URL aponta para um deploy remoto; em localhost o setup é pulado.
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b --noEmit
      - name: Dead code check (knip)
        # Impede que código morto volte a se acumular (entrypoints declarados
        # em knip.json: scripts/, edge functions, e2e, lighthouse.config.js).
        run: npx knip

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run unit tests with coverage
        # O vitest já aplica os thresholds configurados em vite.config.ts
        # (coverage.thresholds) e falha com exit code != 0 se não baterem —
        # não há checagem manual duplicada aqui.
        run: npm run test:run -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dependency audit (production only)
        # Dev-only vulnerabilities (e.g. @lhci/cli, undici via jsdom, uuid) sao aceitas
        # como nao-bloqueantes. Producao esta limpa: `npm audit --omit=dev` = 0 vulnerabilidades.
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download build (dist com env vars injetadas)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download build (dist com env vars injetadas)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test e2e/accessibility.spec.ts

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download build (dist com env vars injetadas)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
            http://localhost:4173/agendar
          configPath: ./lighthouse.config.js
          uploadArtifacts: true
